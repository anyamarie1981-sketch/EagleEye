<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden; background: #004d00;
    }
    .ticker-container {
      width: 100vw; height: 100vh; display: flex; align-items: center; white-space: nowrap;
    }
    .ticker-text {
      font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; color: #ffffff;
      padding-left: 100%;
      animation: marquee 18s linear infinite;
    }
    @keyframes marquee {
      0%   { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>
  <div class="ticker-container">
    <div class="ticker-text" id="ticker">Loading announcement...</div>
  </div>

  <script>
    // Automatically reads the [BannerText] parameters passed directly out of AppSheet
    const urlParams = new URLSearchParams(window.location.search);
    const customText = urlParams.get('msg');
    if (customText) {
      document.getElementById('ticker').innerText = decodeURIComponent(customText);
    }
  </script>
</body>
</html>
